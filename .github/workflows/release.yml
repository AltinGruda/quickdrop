name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: false

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-windows
          path: |
            build/bin/QuickDrop Setup.exe
            build/bin/QuickDrop.exe
          if-no-files-found: error

  macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: false

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build macOS app
        shell: bash
        run: |
          export PATH="$HOME/go/bin:$PATH"
          wails build -platform darwin/universal

      - name: Create DMG
        shell: bash
        run: |
          set -eux
          APP=$(ls -d build/bin/*.app | head -n1)
          APP_NAME=$(basename "$APP" .app)
          STAGING="dmg-staging/${APP_NAME}.app"
          mkdir -p dmg-staging
          cp -R "$APP" "$STAGING"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            "QuickDrop.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-macos
          path: |
            QuickDrop.dmg
            build/bin/*.app
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: quickdrop-windows
          path: windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: quickdrop-macos
          path: macos

      - name: Normalize asset names
        run: |
          cp "windows/QuickDrop Setup.exe" "QuickDrop-setup.exe"
          cp "windows/QuickDrop.exe" "QuickDrop.exe"
          cp "macos/QuickDrop.dmg" "QuickDrop.dmg"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuickDrop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            QuickDrop-setup.exe
            QuickDrop.exe
            QuickDrop.dmg
